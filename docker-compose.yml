name: eve-healthcare

services:
  api:
    build: .
    container_name: api
    restart: on-failure:10
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eve-healthcare-network
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
  
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"  # Added this to work with DataGrip.
    networks:
      - eve-healthcare-network
    volumes:
      - postgres-volume:/var/lib/postgresql/18/docker
      - ./src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-volume:

networks:
  eve-healthcare-network: